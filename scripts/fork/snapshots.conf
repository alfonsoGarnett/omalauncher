# What scripts/fork/save-snapshots.sh copies into which branch: <branch> <source> <path in the branch>.
# A source is a file or a directory on this system (~ is $HOME), or git:<branch>:<path> for a file in this repo.
# Directories are copied whole, except compiled binaries, caches and __pycache__.
# fork/docs and fork/personal only ever go to the private repo; env/omarchy-dex goes to the public fork.

# Our documents (untracked working copies at the repo root)
fork/docs  /omalauncher/AGENTS.md  AGENTS.md
fork/docs  /omalauncher/FORK-LOG.md  FORK-LOG.md
fork/docs  /omalauncher/PROJECT_PLAN.md  PROJECT_PLAN.md

# Personal: widgets, launcher settings, the signing key, themes of unknown license
fork/personal  ~/.config/omalauncher/widgets/30-niagara.owl  widgets/30-niagara.owl
fork/personal  ~/.config/omalauncher/widgets/36-adb-admin.owl  widgets/36-adb-admin.owl
fork/personal  ~/.config/omalauncher/widgets/40-dex-control.owl  widgets/40-dex-control.owl
fork/personal  ~/.config/omalauncher/widgets/42-cheatsheet.owl  widgets/42-cheatsheet.owl
fork/personal  ~/.config/omalauncher/widgets/50-btop.owl  widgets/50-btop.owl
fork/personal  ~/.config/omalauncher/style/style.toml  config/omalauncher/style/style.toml
fork/personal  ~/.config/omalauncher/keymap.xkb  config/omalauncher/keymap.xkb
fork/personal  ~/.config/omalauncher/mouse.conf  config/omalauncher/mouse.conf
fork/personal  ~/.local/share/droid/names.json  local/share/droid/names.json
fork/personal  ~/.config/waybar-themes.base  config/waybar-themes.base
fork/personal  /omalauncher/mod-debug.keystore  mod-debug.keystore

